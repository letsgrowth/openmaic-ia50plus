name: openmaic-ia50plus

services:
  openmaic:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: openmaic-ia50plus:${OPENMAIC_IA50_IMAGE_TAG:-v0.3.1-ia50}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      IA50_INTERNAL_MODE: "true"
      IA50_SINGLE_TEACHER_MODE: "true"
      IA50_CONTENT_WEB_SEARCH: "${IA50_CONTENT_WEB_SEARCH:-true}"
      IA50_CONTENT_IMAGE_GENERATION: "${IA50_CONTENT_IMAGE_GENERATION:-false}"
      IA50_CONTENT_VIDEO_GENERATION: "${IA50_CONTENT_VIDEO_GENERATION:-false}"
      IA50_CONTENT_TTS: "${IA50_CONTENT_TTS:-false}"
      IA50_INTERNAL_TOKEN_FILE: /run/secrets/openmaic_internal_token
      OPENAI_API_KEY_FILE: /run/secrets/openmaic_litellm_api_key
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_MODELS: tutor-50plus
      DEFAULT_MODEL: openai:tutor-50plus
      SEARXNG_BASE_URL: http://searxng:8080
      LLM_THINKING_DISABLED: "true"
      NEXT_PUBLIC_PI_CHAT_ENABLED: "false"
      TTS_BROWSER_NATIVE_ENABLED: "false"
      LOG_LEVEL: info
      LOG_FORMAT: json
    secrets:
      - openmaic_internal_token
      - openmaic_litellm_api_key
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    volumes:
      - openmaic-data:/app/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728
          mode: 1023
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    stop_grace_period: 30s
    networks:
      - ia50_platform
      - ia50_search
      - litellm_gateway

networks:
  ia50_platform:
    name: ia50_private
    external: true
  ia50_search:
    name: ia50_search_private
    external: true
  litellm_gateway:
    name: litellm_litellm_internal
    external: true

volumes:
  openmaic-data:

secrets:
  openmaic_internal_token:
    file: ${IA50_SECRETS_DIR:?set IA50_SECRETS_DIR}/openmaic_internal_token
  openmaic_litellm_api_key:
    file: ${IA50_SECRETS_DIR:?set IA50_SECRETS_DIR}/openmaic_litellm_api_key
